name = "Nemotron 3.5 Bolt"
summary = "74B mixture of experts, 9B active per token, packed into 24 GB. The fastest agent turns on NVIDIA's unified memory."
runtime = "tensorfold-bolt"
vendor = "nvidia"
architecture = "moe"
# Screenshots and photos through the checkpoint's own RADIO tower, which --vision loads.
input = ["text", "image"]

[[hardware]]
gpu = "nvidia-n1x"
ram_class = 128
measured = "measurements/nemotron-3.5-bolt-tensorfold-n1x-128.toml"

[[hardware]]
gpu = "nvidia-n1x"
ram_class = 64
measured = "measurements/nemotron-3.5-bolt-tensorfold-n1x-64.toml"

# IQ2_XXS experts, NVFP4 Mamba projections, Q8_0 attention. The server loads the directory.
[[artifacts]]
repo = "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB"
revision = "a326822af111290f2af5ac59ef4b5040347dabc4"
license = "other (NVIDIA OpenMDW License Agreement 1.1, see the model card)"
files = ["*.safetensors", "*.json", "chat_template.jinja"]
dest = "target"
model = "."

# NVIDIA's LiLiCorr drafter: up to seven draft tokens a round, checked by the target.
[[artifacts]]
repo = "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr"
revision = "4c6a5613b6d887194a3a5493e3a18a5b3930bb86"
license = "other (NVIDIA OpenMDW License Agreement 1.1, see the model card)"
files = ["model.safetensors", "config.json", "hf_quant_config.json"]
dest = "drafter"
draft = "."

# Measured on the N1x with a 226K-token prompt: 31 GiB at load, about 40 GiB at peak. The peak
# leaves room for the other three streams' full windows (2 GiB of bf16 attention cache each)
# and the 8 GiB prompt cache filling, which TensorFold maps as they grow.
[[variant]]
ctx = 262144
peak_ram_gib = 54
peak_gpu_gib = 54
args = ["--parallel", "4", "--prompt-cache-gib", "8"]

# For 64 GB: one stream at the full window and the same 8 GiB prompt cache. Measured on an N1x
# laptop with a 194K-token conversation and its follow-ups: 30 GiB at load, 39.3 GiB at peak once
# the cache held it, and each follow-up resumed in 0.3 to 0.4 s against 86 s for the first turn.
[[variant]]
ctx = 262144
peak_ram_gib = 40
peak_gpu_gib = 40
args = ["--parallel", "1", "--prompt-cache-gib", "8"]

[sampling]
temperature = 1.0
top_p = 0.95

[server]
args = ["--max-tokens", "32768", "--thinking", "--vision"]
