name = "Inkling 2 Mini"
runtime = "llamacpp-inkling2"
vendor = "thinkingmachines"
architecture = "moe"
# Screenshots and photos through the checkpoint's vision tower, loaded via --mmproj.
input = ["text", "image"]

[[hardware]]
gpu = "intel-arc-b390"
measured = "measurements/inkling-2-mini-llamacpp-arc-b390.toml"

# Bartowski's imatrix-calibrated Q4_0 build (15.1 GB, Q6_K output head) in mainline llama.cpp's
# inkling2_loop layout, plus the F16 vision projector. On Arc B390 Vulkan (which has no native FP4
# hardware), Q4_0 experts run ~30% faster than NVFP4 while cutting the Q8_0 attention/head overhead
# that slows down UD-Q4_K_XL.
[[artifacts]]
repo = "bartowski/Inkling-2-Mini-GGUF"
revision = "ad66863fd3b7f3236c0b7a0862412c9e00f78a6e"
license = "apache-2.0"
files = ["Inkling-2-Mini-Q4_0.gguf", "mmproj-Inkling-2-Mini-f16.gguf"]
model = "Inkling-2-Mini-Q4_0.gguf"

# Measured on a 64 GB XPS 14 (Arc B390) running the Omarchy desktop with a 38K-token prompt:
# 20.5 GiB at load (~22 GiB peak) with default F16 KV cache at 131K context, keeping cooperative-matrix
# Vulkan Flash Attention active (~2x faster long-context prefill than Q4_0 KV) within Arc B390's ~30 GiB limit.
[[variant]]
ctx = 131072
peak_ram_gib = 25
peak_gpu_gib = 22

# Thinking Machines' generation defaults: temperature 1.0, no top-p or top-k cut.
[sampling]
temperature = 1.0
top_p = 1.0
top_k = 0

# One slot with Flash Attention and F16 KV cache; vision projector loaded onto the GPU.
# DSpark speculative decoding is left off: verifying 2-7 draft tokens across 128 MoE experts
# multiplies memory reads faster than acceptance pays back on Arc B390's ~100 GB/s bandwidth.
[server]
args = ["--parallel", "1", "--flash-attn", "on", "--jinja",
        "--mmproj", "/models/mmproj-Inkling-2-Mini-f16.gguf", "--mmproj-offload"]
