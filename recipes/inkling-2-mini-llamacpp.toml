name = "Inkling 2 Mini"
runtime = "llamacpp-inkling2"
vendor = "thinkingmachines"
architecture = "moe"
# Screenshots and photos through the checkpoint's vision tower, loaded via --mmproj.
input = ["text", "image"]

[[hardware]]
gpu = "intel-arc-b390"
measured = "measurements/inkling-2-mini-llamacpp-arc-b390.toml"

[[hardware]]
gpu = "amd-strix-point"
measured = "measurements/inkling-2-mini-llamacpp-strix-point.toml"

[[hardware]]
gpu = "amd-strix-halo"
measured = "measurements/inkling-2-mini-llamacpp-strix-halo.toml"

# ISTA-DASLab's GSQ-RCO mixed-precision IQ3_S build (11.43 GB: 10.50 GB on GPU, 0.93 GB BF16
# token embedding in system RAM; 99.2% task recovery against the NVFP4/MXFP8 base checkpoint)
# plus the BF16 vision projector. Cuts 3.6 GB vs Q4_0 so 131K context fits inside a 32 GB
# Arc B390's ~23 GiB budget beside the desktop.
[[artifacts]]
repo = "ISTA-DASLab/Inkling-2-Mini-GSQ-RCO-GGUF"
revision = "f0da1097633dd7c2f5733e4077cff861be122245"
license = "apache-2.0"
files = ["Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf", "mmproj-Inkling-2-Mini-BF16.gguf"]
model = "Inkling-2-Mini-GSQ-RCO-IQ3_S.gguf"

# IncoAI's DFlash2 block-diffusion drafter quantized to Q4_K_M (287 MB), passed via --model-draft.
[[artifacts]]
repo = "na0x2c6/Inkling-2-Mini-DFlash2-GGUF"
revision = "e12c9c89cf07a2e063a7a95cc753165c662976d1"
license = "apache-2.0"
files = ["Inkling-2-Mini-DFlash2-Q4_K_M.gguf"]
draft = "Inkling-2-Mini-DFlash2-Q4_K_M.gguf"

# For 64 GB: full 256K window (25.6 GiB at load with DFlash2 on Strix Halo),
# keeping cooperative-matrix Vulkan Flash Attention active within a 64 GB Arc B390's ~30 GiB limit.
[[variant]]
ctx = 262144
peak_ram_gib = 29
peak_gpu_gib = 28

# For 32 GB: measured on a 32 GB XPS 16 (Arc B390) and 32 GB TUXEDO (Strix Point) running the
# Omarchy desktop with a 38K-token prompt: 19.6-19.8 GiB at load (2.8-3.0 GiB min available)
# with default F16 KV cache and DFlash2 at 131K context, within a 32 GB laptop's ~22.5 GiB budget.
[[variant]]
ctx = 131072
peak_ram_gib = 22
peak_gpu_gib = 21

# Thinking Machines' generation defaults: temperature 1.0, no top-p or top-k cut.
[sampling]
temperature = 1.0
top_p = 1.0
top_k = 0

# One slot with Flash Attention, F16 KV cache, --ubatch-size 1024 (+9-18% faster prefill), and
# DFlash2 block-diffusion drafting capped at --spec-draft-n-max 2 (higher draft lengths read too
# many routed MoE experts per verification pass on Vulkan; n_max=2 wins +23-39% on 38.6K long
# decode and +11-35% on edit decode across Arc B390, Strix Point and Strix Halo).
[server]
args = ["--parallel", "1", "--ubatch-size", "1024", "--flash-attn", "on", "--jinja",
        "--spec-type", "draft-dflash2", "--spec-draft-n-max", "2",
        "--mmproj", "/models/mmproj-Inkling-2-Mini-BF16.gguf", "--mmproj-offload"]
