# MiniMax H3, which makes video with its sound, from a prompt or from a picture as its first
# frame. The pruned first/last-frame model at Q4, run in 4 steps with MiniMax's own turbo LoRA,
# P-H3's 4B text encoder in place of the 32B one so it fits beside the desktop, and the video and
# audio decoders. Its license excludes some territories; it is never recommended, only offered.
name = "MiniMax H3"
vendor = "minimax"
kind = "video"
runtime = "sdcpp"

[[hardware]]
gpu = "amd-strix-halo"
ram_class = 64
measured = "measurements/minimax-h3-sdcpp-strix-halo-64.toml"

[[artifacts]]
repo = "leejet/MiniMax-H3-GGUF"
revision = "eee1dd2f05b755b28bd1b785925cbfeebfcba9d9"
license = "other: minimax-h3-community-license-agreement"
files = ["minimax_h3_fl2va_pruned-Q4_K_M.gguf"]
model = "minimax_h3_fl2va_pruned-Q4_K_M.gguf"

[[artifacts]]
repo = "PrunaAI/P-H3-Image-Comfy"
revision = "44a0fb73f299da1bb715bdb5ff59ce3fd3c6f543"
license = "other: minimax-h3-community-license-agreement"
files = ["text_encoders/p-h3-image_text_encoder_int8_convrot.safetensors"]
text_encoder = "text_encoders/p-h3-image_text_encoder_int8_convrot.safetensors"

[[artifacts]]
repo = "Comfy-Org/MiniMax-H3"
revision = "4b53a35191437de05370da548e59aeabe2a5a09a"
license = "other: minimax-h3-community-license-agreement"
files = ["vae/minimax_h3_video_vae_fp16.safetensors", "vae/minimax_h3_audio_vae_fp32.safetensors", "loras/minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16.safetensors"]
vae = "vae/minimax_h3_video_vae_fp16.safetensors"
audio_vae = "vae/minimax_h3_audio_vae_fp32.safetensors"
lora = "loras/minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16.safetensors"

# Measured: 36.2 GiB of GPU memory at its peak, making a 2.3 s 864x480 clip in 178 s.
[[variant]]
peak_ram_gib = 38
peak_gpu_gib = 38

[server]
args = ["--cfg-scale", "1.0", "--steps", "4", "--offload-to-cpu"]
