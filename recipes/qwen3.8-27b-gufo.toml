name = "Qwen3.8 27B"
summary = "Dense 27B at 4-bit with DFlash2 drafting. Under half the memory of Flash Next, at about half its speed."
runtime = "gufo"
vendor = "qwen"
architecture = "dense"
# Screenshots and photos through its vision projector, which loads on first use.
input = ["text", "image"]

[[hardware]]
gpu = "amd-strix-halo"
ram_class = 128
measured = "measurements/qwen3.8-27b-gufo-strix-halo-128.toml"

[[artifacts]]
repo = "unsloth/Qwen3.8-27B-GGUF"
revision = "4ca720788d1e01f1bff70c033e0d0028fd02e502"
license = "apache-2.0"
files = ["Qwen3.8-27B-UD-Q4_K_XL.gguf", "mmproj-BF16.gguf"]
model = "Qwen3.8-27B-UD-Q4_K_XL.gguf"

[[artifacts]]
repo = "z-lab/Qwen3.8-27B-DFlash2-GGUF"
revision = "2d9571f8ce46e151f61c6499c99dee6079e1d610"
license = "apache-2.0"
files = ["Qwen3.8-27B-DFlash2-Q4_K_M.gguf"]
draft = "Qwen3.8-27B-DFlash2-Q4_K_M.gguf"

# Measured with a 222K-token prompt: about 40 GiB at peak, 40 GiB at load.
[[variant]]
ctx = 262144
peak_ram_gib = 42
peak_gpu_gib = 40

[[variant]]
ctx = 131072
peak_ram_gib = 40
peak_gpu_gib = 38

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20

[server]
args = ["--speculative", "dflash2", "--cache-ram-bytes", "4294967296", "--mmproj", "/models/mmproj-BF16.gguf"]
