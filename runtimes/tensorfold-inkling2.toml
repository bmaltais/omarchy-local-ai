# TensorFold's native server with the Inkling 2 Mini CUDA engine (ashhart/TensorFold PR #4441, Jürgen Schmied's fork
# at dc2ca8a1) and MiaAI-Lab's 30 patches for it (DFlash2 block-diffusion drafter, FP8 KV, attention projections and
# tensor-core attention, FP4/MXFP8 prefill tensor cores, vision, structured output and Inkling's reply parser), built
# on NVIDIA's PyTorch container by images/tensorfold-inkling2 and published by its workflow. Configured by
# `tensorfold-native serve` arguments, with the model directory bare and the key in TENSORFOLD_API_KEY. The image sets
# MiaAI-Lab's serving environment: a 9 GiB reserve, FP8 attention projections and tensor cores, and tensor-core prefill.
image = "ghcr.io/omacom/omarchy-local-ai/tensorfold-inkling2@sha256:7e88d8873657e0cf105a89e3a3d1ebed1908208440a07987706c219f4f38b158"
tier = "third-party"
review = "reviews/tensorfold-inkling2-7e88d8873657.toml"
port = 8888
command = ["tensorfold-native", "serve", "--host", "0.0.0.0", "--port", "8888", "--no-update-check"]
health = { probe = ["curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8888/health"] }
# The tmpfs holds the driver's compiled-kernel cache.
run = { devices = ["cdi-nvidia"], memlock = "unlimited", tmpfs = "/tmp" }
# Its CUDA kernels are built for the GB10's sm_121 (the N1x shares its class).
gpus = ["nvidia-gb10"]
reserved = ["--host", "--port", "--api-key", "--api-key-file", "--allowed-host", "--allowed-origin", "--learn", "--learn-dir", "--learn-conversations", "--recall", "--recall-dir", "--record", "--dashboard", "--metrics-open", "--speed-up", "--vision-urls", "TENSORFOLD_API_KEY", "TENSORFOLD_NO_UPDATE_CHECK", "TENSORFOLD_MEMORY_RESERVE_GIB", "HF_HUB_OFFLINE", "HF_TOKEN"]

[inputs]
model = { positional = true }
draft = { arg = "--drafter" }
ctx = { arg = "--context" }
alias = { arg = "--name" }
key = { env = "TENSORFOLD_API_KEY" }
temperature = { arg = "--temperature" }
top_p = { arg = "--top-p" }
top_k = { arg = "--top-k" }
