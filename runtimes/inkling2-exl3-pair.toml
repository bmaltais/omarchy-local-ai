# Inkling 2 Small across two DGX Sparks: oracle9i88/inkling2-exl3 (0xSero's Inkling-2 overlay for exllamav3 v1.6.6,
# with the two-Spark server) on NVIDIA's PyTorch container, built by images/inkling2-exl3. Each rank holds half of
# every layer's experts and they exchange over NCCL on the ConnectX-7 cable's RoCE ports; rank 0 here serves an
# OpenAI-compatible API with streaming, reasoning, tool calls and images. torchrun takes the rank and the rendezvous
# from its PET_* variables. The server checks no key, so on rank 0 the image's Caddy answers on the model's port,
# refuses any request without the key in I2_API_KEY and streams the rest to the server on loopback.
image = "ghcr.io/omacom/omarchy-local-ai/inkling2-exl3@sha256:8a5c08b9d3c27113eb86e5581b148f745abde6466a8aa1be7df87cd1f67de89b"
tier = "third-party"
review = "reviews/inkling2-exl3-8a5c08b9d3c2.toml"
port = 18100
command = ["serve"]
listen = { host = "--host", port = "--port" }
health = { probe = ["/bin/sh", "-c", "curl -fsS -o /dev/null --max-time 4 -H \"Authorization: Bearer $I2_API_KEY\" http://127.0.0.1:@PORT@/health"] }
run = { devices = ["cdi-nvidia", "infiniband"], memlock = "unlimited", network = "fabric", shm_size_gib = 16 }
# Two DGX Sparks cabled together.
gpus = ["nvidia-gb10-pair"]
reserved = ["--host", "--port", "--kv-gb", "--vision", "I2_API_KEY", "I2_EXPERT_COUNT", "I2_PROFILE_AT", "HF_TOKEN"]

[inputs]
model = { arg = "--model" }
ctx = { arg = "--max-model-len" }
alias = { arg = "--served-name" }
key = { env = "I2_API_KEY" }
temperature = { arg = "--default-temperature" }

[pair]
nodes = 2
master_port = 29620
# Each rank's HOME, where PyTorch and Triton keep their compiled kernels between starts.
state = "/state"

# The engine's own two-Spark settings (spark/launch_3spark.sh), less the three-node routing.
[pair.env]
HOME = "/state"
HF_HUB_OFFLINE = "1"
PET_NNODES = "@WORLD@"
PET_NODE_RANK = "@RANK@"
PET_MASTER_ADDR = "@MASTER_ADDR@"
PET_MASTER_PORT = "@MASTER_PORT@"
GLOO_SOCKET_IFNAME = "@SOCKET_IFNAME@"
NCCL_NET_PLUGIN = "none"
NCCL_CROSS_NIC = "1"
NCCL_IB_MERGE_NICS = "0"
NCCL_CUMEM_ENABLE = "0"
NCCL_MIN_NCHANNELS = "4"
NCCL_MAX_NCHANNELS = "4"
NCCL_P2P_DISABLE = "1"
NCCL_SHM_DISABLE = "1"
TORCH_NCCL_USE_COMM_NONBLOCKING = "0"
I2_P2P_AR = "1"
MALLOC_MMAP_THRESHOLD_ = "262144"
MALLOC_TRIM_THRESHOLD_ = "33554432"
