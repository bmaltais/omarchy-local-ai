# TensorFold's native server, tensorfold-native, from its signed upstream release (1.2.1) with no patches,
# unpacked onto debian:trixie-slim by omacom/tensorfold-image. Its CUDA kernels are embedded in the
# executable and the driver's libcuda arrives through CDI, so the image holds no CUDA toolkit or PyTorch;
# it adds cuBLASLt for --vision and libjpeg-turbo and libwebp for JPEG and WebP pictures.
# Configured by `tensorfold-native serve` arguments, with the model directory bare and the key in
# TENSORFOLD_API_KEY. The image sets TENSORFOLD_MEMORY_RESERVE_GIB=9 (12.2 by default), which gives the
# difference to the prompt cache, and TF_FLASHNEXT_CHUNK_SOLO=3072, which only Flash Next reads.
# Published by Omacom from omacom/tensorfold-image.
image = "ghcr.io/omacom/tensorfold@sha256:c88821d872e22f9dc6148173816b654e2c6dcd712fae50bc5e95915e3f817856"
tier = "third-party"
review = "reviews/tensorfold-c88821d872e2.toml"
port = 8888
command = ["tensorfold-native", "serve", "--host", "0.0.0.0", "--port", "8888", "--no-update-check"]
health = { probe = ["curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8888/health"] }
run = { devices = ["cdi-nvidia"], memlock = "unlimited" }
reserved = ["--host", "--port", "--api-key", "--api-key-file", "--allowed-host", "--allowed-origin", "--learn", "--learn-dir", "--learn-conversations", "--recall", "--recall-dir", "--record", "--dashboard", "--metrics-open", "--speed-up", "--vision-urls", "TENSORFOLD_API_KEY", "TENSORFOLD_NO_UPDATE_CHECK", "TENSORFOLD_MEMORY_RESERVE_GIB", "HF_HUB_OFFLINE", "HF_TOKEN"]

[inputs]
model = { positional = true }
draft = { arg = "--drafter" }
ctx = { arg = "--context" }
alias = { arg = "--name" }
key = { env = "TENSORFOLD_API_KEY" }
temperature = { arg = "--temperature" }
top_p = { arg = "--top-p" }
top_k = { arg = "--top-k" }
