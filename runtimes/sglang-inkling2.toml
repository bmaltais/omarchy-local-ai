# SGLang, as LMSYS publishes it for Inkling 2 Mini (lmsysorg/sglang:inkling-2-mini, pinned by its arm64
# digest), with no changes: the build Thinking Machines' model card and SGLang's cookbook name, which carries
# Inkling's looped layers, its NVFP4 and MXFP8 experts, the DSpark drafter and the FlashAttention-4 kernels
# for the GB10. Configured by `sglang.launch_server` arguments. It takes its key only as --api-key, so Omarchy
# substitutes it inside the container from the Podman secret; the key never reaches the unit file but is
# visible in the process list. The root is read-only, so HOME and the JIT caches go to the tmpfs, and every
# start compiles them again (about four minutes in all).
image = "docker.io/lmsysorg/sglang@sha256:bc811ac7ac68c6fca116a49750baca817b8613a30abface8a347682b55d132e3"
tier = "third-party"
review = "reviews/sglang-inkling2-bc811ac7ac68.toml"
port = 8000
command = ["env", "HOME=/tmp", "XDG_CACHE_HOME=/tmp/.cache", "HF_HUB_OFFLINE=1",
           "python3", "-m", "sglang.launch_server", "--host", "0.0.0.0", "--port", "8000"]
shell = "/bin/bash"
key_on_cmdline = true
# The server listens only once the model is loaded, and /health answers 503 until its warm-up is done.
health = { probe = ["curl", "-fsS", "-o", "/dev/null", "--max-time", "4", "http://127.0.0.1:8000/health"] }
# Its scheduler and detokenizer share tensors through /dev/shm.
run = { devices = ["cdi-nvidia"], tmpfs = "/tmp", shm_size_gib = 16 }
# The build's CUDA kernels are for the GB10's sm_121.
gpus = ["nvidia-gb10"]
reserved = ["--api-key", "--admin-api-key", "--host", "--port", "--tokenizer-path", "--download-dir",
            "--enable-metrics", "--crash-dump-folder", "--enable-ssl-refresh", "--ssl-keyfile", "--ssl-certfile",
            "--trust-remote-code",
            "SGLANG_ADMIN_API_KEY", "HF_TOKEN"]

[inputs]
model = { arg = "--model-path" }
ctx = { arg = "--context-length" }
alias = { arg = "--served-model-name" }
key = { arg = "--api-key" }
