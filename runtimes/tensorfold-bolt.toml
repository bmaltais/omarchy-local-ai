# TensorFold (Apache-2.0) with Mia's AI Lab Bolt backend (MIT) for Nemotron 3.5 Bolt on NVIDIA's
# GB10-class GPUs, built from MiaAI-Lab/Nemotron-3.5-Bolt-TensorFold-DGX-Spark at 6b064a3 on
# TensorFold eea9dc9 and nvcr.io/nvidia/pytorch:26.07-py3. Configured by `tensorfold-native serve`
# arguments, with the model directory bare and the key in TENSORFOLD_API_KEY.
# libbolt reads the drafter's directory from BOLT_DRAFT; its other BOLT_* switches keep their defaults.
# TODO: image digest and review once the image is published. It needs Bolt patched to upload
# through pinned memory (MiaAI-Lab/Nemotron-3.5-Bolt-TensorFold-DGX-Spark, 0ec45f4 locally):
# unpatched it loads in 27 minutes on the N1x. Measured from the local build sha256:0443af17.
image = "ghcr.io/miaai-lab/nemotron-3.5-bolt-tensorfold-dgx-spark@sha256:TODO"
tier = "third-party"
review = "reviews/tensorfold-bolt-TODO.toml"
port = 8888
command = ["tensorfold-native", "serve", "--host", "0.0.0.0", "--port", "8888", "--no-update-check", "--snapshot-dir", "none"]
health = { probe = ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=4)"] }
run = { devices = ["cdi-nvidia"], memlock = "unlimited" }
reserved = ["--host", "--port", "--api-key", "--api-key-file", "--snapshot-dir", "--learn-dir", "--record", "--dashboard", "--metrics-open", "TENSORFOLD_API_KEY", "HF_HUB_OFFLINE", "HF_TOKEN"]

[inputs]
model = { positional = true }
draft = { env = "BOLT_DRAFT" }
ctx = { arg = "--context" }
alias = { arg = "--name" }
key = { env = "TENSORFOLD_API_KEY" }
temperature = { arg = "--temperature" }
top_p = { arg = "--top-p" }
top_k = { arg = "--top-k" }
