# acestep.cpp's ace-server built with CUDA, for music models on NVIDIA's unified-memory ARM
# machines (GB10, N1x). The same commit as acestep, from images/acestep-cuda, with two patches:
# the key from ACE_API_KEY (or --api-key-file), and weights uploaded through ordinary memory, which
# loads a model in a second where the driver takes over a minute from the file's mapping. The
# driver's libcuda arrives through CDI; the image carries only cudart and cuBLAS. It takes the folder holding its models, loads one only when
# asked for a song and frees it after, so it holds no GPU memory between songs and is checked by
# the models it found (api = "acestep") instead of /v1/models.
image = "ghcr.io/omacom/omarchy-local-ai/acestep-cuda@sha256:e1a9da09b3a031afdaf89764d48e9e51d250d5a15b4596e63ffcf3edd66e758b"
tier = "third-party"
review = "reviews/acestep-cuda-e1a9da09b3a0.toml"
api = "acestep"
port = 8085
command = ["ace-server", "--host", "0.0.0.0", "--port", "8085"]
health = { probe = ["/bin/sh", "-c", "curl -fsS -H \"Authorization: Bearer $OMARCHY_LOCAL_KEY\" http://127.0.0.1:8085/health"] }
# It writes nothing; the tmpfs is for the driver's caches.
run = { devices = ["cdi-nvidia"], tmpfs = "/tmp" }
# Its CUDA kernels are built for the GB10's sm_121 (the N1x shares its class).
gpus = ["nvidia-gb10"]
reserved = ["--host", "--port", "--api-key", "--api-key-file", "ACE_API_KEY"]

[inputs]
model = { arg = "--models" }
key = { env = "ACE_API_KEY" }
