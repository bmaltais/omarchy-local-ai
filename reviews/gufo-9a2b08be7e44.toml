  "license: MIT for Gufo's code (the LICENSE at 684b716 hashes as above, unchanged since 0.28.1); adapted code and dependencies keep their notices; Caddy is Apache-2.0, shipped in /usr/share/licenses/caddy",
  "build: images/gufo's Containerfile copies only Caddy, its license, the Caddyfile and serve onto gufo-org's runtime image at the pinned digest; gufo itself is used as gufo-org published it",
  "behavior: loads models from local paths only; fetches client-supplied image URLs, which the internal network blocks",
  "auth: Gufo has had no API key since 0.29 (gufo-org/gufo#957: 'Gufo ignores API keys'), so serve puts Gufo on the container's loopback (127.0.0.1:18080) and Caddy, with its admin API, automatic HTTPS and config persistence off, on the model's port, refusing every request without 'Authorization: Bearer $GUFO_API_KEY'; serve refuses to start with an empty key. Checked in CI and locally: no key 401, wrong key 401, right key 200, tailnet Host 200, empty key refused",
  "the key no longer reaches any command line: it reaches Caddy as GUFO_API_KEY from the Podman secret",
  "acceptance (2026-11-26): on an HP ZBook Ultra G3a (Ryzen AI Max+ PRO 495, 192 GB), Inkling 2 Mini starts through the engine with read-only root, dropped capabilities and no-new-privileges, passes its health probe, returns 401 without or with a wrong key and 200 with the right key on /, /ready, /health and /v1/models, keeps the key out of ps arguments, and exits 0 on SIGTERM",
