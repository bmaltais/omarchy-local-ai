checked = [
  "license: inkling2-exl3 is MIT (the LICENSE at d9e41c98 hashes as above); exllamav3 is MIT (LICENSE at v1.6.6, SHA-256 27a32b6263fcd96c79d3beeecf221c4366780bdf15ad51986f48650bd7369bff); Caddy is Apache-2.0 (LICENSE at v2.11.9, SHA-256 cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30), shipped in /usr/share/licenses/caddy; the base is NVIDIA's PyTorch container under its own terms, used as published, as the TensorFold images are",
  "build: images/inkling2-exl3's Containerfile fetches both sources at their pinned commit and tag, applies the engine's own patch and overlay unchanged, installs the engine's lock file and four packages it leaves out (huggingface_hub 1.33.0, typer 0.28.0, shellingham 1.5.4, annotated-doc 0.0.5), all by SHA-256, imports everything the server imports, and builds the extension, on nvcr.io/nvidia/pytorch@sha256:7531d90bcbe0e43e1f7363029c7e145ce90eebeb494a7b4695fdba0329d7c3c3; built with Podman on a DGX Spark",
  "behavior: torchrun runs one rank of server/i2_server.py per Spark, taking the rank and the rendezvous from the PET_* variables the engine sets; rank 0 loads the model directory given with --model, serves the API and runs the vision tower, rank 1 serves no HTTP. The image carries no weights. Requests read only data: and inline images, never URLs; /admin/expert_load writes only when I2_EXPERT_COUNT is set, which the runtime reserves",
  "behavior: the server checks no key, so on rank 0 Caddy, with its admin API, automatic HTTPS and config persistence off, binds the host and port the engine gives (loopback), refuses every request without `Authorization: Bearer $I2_API_KEY`, and streams the rest to the server on a Unix socket in the container's own /tmp (the one change to the engine: its uvicorn.run takes I2_UDS), since on the host's network a loopback port would let other local accounts past the key; serve refuses to start rank 0 with an empty key",
  "acceptance (2026-11-22): on two DGX Sparks (spark1 running the Omarchy desktop, spark2 headless), both ranks run rootless with a read-only root and model mounts (writing to / fails), all capabilities dropped (CapEff 0) and no-new-privileges, on the host network for the ConnectX-7 link (NCCL over RoCE); 31-52 tokens a second, 561 tokens a second reading a 38.6K-token prompt",
  "acceptance (2026-11-22): the API listens on 127.0.0.1 only, and nothing else of the server does on either Spark; requests without the key or with a wrong one get 401, on /v1/models, /v1/chat/completions and /health, and with it 200",
]
