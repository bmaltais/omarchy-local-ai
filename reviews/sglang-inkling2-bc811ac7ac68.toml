  "license: SGLang is Apache-2.0 (the LICENSE in the image's /sgl-workspace/sglang hashes as above); the image is NVIDIA's CUDA base with PyTorch and SGLang's Python and CUDA dependencies, each under its own license, used as published",
  "provenance: the image's labels name SGLang's own build (ai.sglang.build.commit 03fde9cc, ai.sglang.build.url github.com/sgl-project/sglang/actions/runs/44644189360); it is the tag Thinking Machines' model card and SGLang's Inkling 2 Mini cookbook point to, pinned by the arm64 digest",
  "behavior: loads the model directory given with --model-path; the image carries no weights. The runtime starts it with HF_HUB_OFFLINE=1 and reserves the admin key, metrics, SSL, download and remote-code flags. --admin-api-key is never set, so the admin endpoints (weight updates, LoRA loading, profiling) are refused",
  "acceptance (2026-11-21): serves Inkling 2 Mini with a read-only root and a tmpfs at /tmp holding HOME and its JIT caches, all capabilities dropped, no-new-privileges and the GPU through CDI on a DGX Spark running the desktop, at 42-51 tokens a second; it starts in about four and a half minutes, compiling its kernels again each time",
  "acceptance (2026-11-21): rejects requests without the key or with a wrong one (401) and serves them with it (200) on /v1/models and /v1/chat/completions; /health is open by design and answers 503 until the model is warm",
  "acceptance (2026-11-21): reads text from a PNG through the vision tower and makes a tool call and answers from its result",
  "acceptance (2026-11-21): stops on SIGTERM in about four seconds with exit code 0, and the memory is free at once",
