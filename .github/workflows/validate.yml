name: Validate catalog and engine

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate schema, trust-model rules, artifacts and licenses
        run: ./omarchy-local-ai validate . --online
      - name: Test engine
        run: ./tests/engine-test.sh
