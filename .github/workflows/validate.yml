name: Validate catalog

on:
  pull_request:
  push:
    branches: [schema-1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog
      - uses: actions/checkout@v4
        with:
          repository: omacom/omarchy
          ref: quattro
          path: omarchy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate schema, trust-model rules, artifacts and licenses
        env:
          OMARCHY_PATH: ${{ github.workspace }}/omarchy
        run: python3 omarchy/bin/omarchy-agent-local-validate catalog --online
